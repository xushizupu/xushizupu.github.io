name: Auto-build data.json

on:
  push:
    branches: [main, master]
    paths:
      - 'source.csv'
      - 'source.xlsx'
      - 'build.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install openpyxl (for .xlsx source)
        run: pip install openpyxl

      - name: Generate data.json from source
        run: python build.py

      - name: Commit data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json unchanged, nothing to commit"
          else
            git commit -m "build: auto-update data.json from source"
            git push
          fi
